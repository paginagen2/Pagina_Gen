<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b10">
  <title>Mis favoritos | Cancionero Gen</title>
  <meta name="description" content="Tus canciones favoritas del Cancionero Gen.">
  <meta property="og:image" content="https://pagina-gen.web.app/aadocumentos/imagenes/og-image.jpg">
  <link rel="icon" href="../aadocumentos/svg/guitarra.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../aaglobal/style.css">
  <link rel="stylesheet" href="../aaglobal/sidebar.css?v=20260729-mobile-account">
  <link rel="stylesheet" href="../aaglobal/site-polish.css?v=20260729-responsive">
  <link rel="stylesheet" href="cancionero.css?v=20260728-favorites-list">
  <link rel="stylesheet" href="favoritos.css?v=20260728">
</head>
<body>
  <svg class="icon-library" aria-hidden="true">
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 9l11-2M6 21c2.2 0 4-1.3 4-3s-1.8-3-4-3-4 1.3-4 3 1.8 3 4 3Zm11-2c2.2 0 4-1.3 4-3s-1.8-3-4-3-4 1.3-4 3 1.8 3 4 3Z"/></symbol>
  </svg>

  <aside class="sidebar home-sidebar site-sidebar" data-gen-sidebar aria-label="Navegación principal"></aside>
  <script src="../aaglobal/sidebar.js?v=20260729-mobile-account"></script>

  <main class="main songbook-main favorites-main" id="contenido-principal">
    <header class="songbook-header favorites-header">
      <div>
        <span class="favorites-kicker">Tu colección</span>
        <h1>Mis favoritos</h1>
      </div>
      <a class="favorites-back" href="cancionero.html">
        <svg aria-hidden="true"><use href="#i-arrow-left"/></svg>
        Volver al cancionero
      </a>
    </header>

    <section class="favorites-panel" aria-labelledby="favoritesTitle">
      <div class="favorites-intro">
        <div>
          <h2 id="favoritesTitle">Canciones que guardaste</h2>
          <p>Tu selección personal para encontrarlas cuando quieras.</p>
        </div>
        <span class="favorites-count" id="favoritesCount" hidden></span>
      </div>
      <div id="favoritesContent" aria-live="polite" aria-busy="true">
        <div class="favorites-loading"><span>♪</span><p>Cargando tus favoritos…</p></div>
      </div>
    </section>
  </main>

  <div class="status-toast" id="statusToast" aria-live="polite"><div class="toast" id="toast"><span id="toastIcon">ℹ</span><span id="toastMessage">Mensaje</span></div></div>

  <script type="module" src="../auth.js?v=20260727-role-codes"></script>
  <script type="module" src="favoritos.js?v=20260728-load-fix"></script>
</body>
</html>
