<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="icon" href="../aadocumentos/svg/vida.svg" type="image/x-icon">
    <script type="module" src="../aaglobal/firebase-config.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <a href="../index.html" class="menu-item">
      <img src="../aadocumentos/svg/casa.svg" alt="Inicio" class="menu-icon">
      <span class="menu-text">Inicio</span>
    </a>
    <a href="../cancionero/cancionero.html" class="menu-item">

      <img src="../aadocumentos/svg/guitarra.svg" alt="Cancionero" class="menu-icon">
      <span class="menu-text">Cancionero</span>
    </a>
    <a href="../gen_animadores/gen-animadores.html" class="menu-item active">
      <img src="../aadocumentos/svg/vida.svg" alt="Gen Animadores" class="menu-icon">
      <span class="menu-text">Gen Animadores</span>
    </a>
    <a href="../biblioteca/biblioteca.html" class="menu-item">
      <img src="../aadocumentos/svg/libros.svg" alt="Biblioteca" class="menu-icon">
      <span class="menu-text">Biblioteca</span>
    </a>
    <a href="../introduccion/introduccion.html" class="menu-item">
      <img src="../aadocumentos/svg/libro.svg" alt="Sobre el Movimiento" class="menu-icon">
      <span class="menu-text">Sobre el Movimiento</span>
    </a>
  </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Header específico para reflexiones -->
        <div class="recursos-header reflexiones">
            <h1>🤔 Reflexiones Guiadas</h1>
            <p class="subtitle">Actividades de introspección y crecimiento personal para profundizar en la espiritualidad y el autoconocimiento</p>
        </div>

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <div class="breadcrumb-nav">
                <a href="gen-animadores.html">Gen Animadores</a>
                <span class="breadcrumb-separator">›</span>
                <span>Reflexiones Guiadas</span>
            </div>
        </div>

        <!-- Sección de búsqueda -->
        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchReflexiones" 
                    class="search-input"
                    placeholder="🔍 Buscar reflexiones por tema, objetivo, materiales..."
                >
                <button class="search-btn" onclick="buscarReflexiones()">🔍</button>
            </div>
        </div>

        <!-- Lista de reflexiones -->
        <div class="recursos-list" id="reflexionesList">
            <div class="loading-state">
                <div class="loading-icon">⏳</div>
                <h3>Conectando con Firebase...</h3>
            </div>
        </div>

        <!-- Botón volver -->
        <div style="text-align: center; margin: 3rem 0;">
            <a href="gen-animadores.html" class="volver-btn">
                ← Volver a Gen Animadores
            </a>
        </div>
    </div>

    <!-- Modal para mostrar recurso completo -->
    <div id="modalRecurso" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button onclick="cerrarModal()" class="modal-close">✕</button>
            <div id="contenidoRecurso"></div>
        </div>
    </div>

    <script src="recursos-unificado.js"></script>
