name: Preparar sincronización offline

# Puede ejecutarse al activar el sistema, manualmente y cada 30 minutos.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/preparar-sincronizacion-offline.yml'
      - 'aaglobal/offline-manager.js'
      - 'scripts/generar-sincronizacion-offline.js'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preparar-sincronizacion-offline
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Generar estado y diferencias
        run: npm run generar-sincronizacion-offline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Guardar archivos generados
        id: cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/sincronizacion
          if git diff --cached --quiet; then
            echo "No hay cambios para sincronizar."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: preparar sincronización offline"
          git push
          echo "publicar=true" >> "$GITHUB_OUTPUT"
