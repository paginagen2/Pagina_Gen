name: Generar inicio diario

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/generar-inicio.js'
      - 'scripts/generar-cancionero.js'
  schedule:
    # Primer intento y comprobación temprana, evitando el minuto 0 porque
    # GitHub Actions suele tener más demoras al comienzo de cada hora.
    - cron: '2,7 0 * * *'
      timezone: 'America/Argentina/Buenos_Aires'
    # Respaldo posterior al reinicio diario de cuota de Firestore.
    - cron: '30 5 * * *'
      timezone: 'America/Argentina/Buenos_Aires'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Comparte la cola con cualquier workflow que publique archivos generados.
  # Así dos procesos no intentan hacer git push sobre main al mismo tiempo.
  group: publicar-datos-generados-main
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Comprobar si el archivo diario ya está vigente
        id: vigencia
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then
            echo "generar=true" >> "$GITHUB_OUTPUT"
            echo "Ejecución manual o por cambio de código: se fuerza la actualización."
            exit 0
          fi

          fecha_hoy="$(TZ=America/Argentina/Buenos_Aires date +%F)"
          fecha_archivo="$(node -e "try { process.stdout.write(require('./datos/inicio.json').fechaGeneracion || '') } catch (_) {}")"
          if [ "$fecha_archivo" = "$fecha_hoy" ]; then
            echo "generar=false" >> "$GITHUB_OUTPUT"
            echo "inicio.json ya corresponde a $fecha_hoy; no se consultará Firebase."
          else
            echo "generar=true" >> "$GITHUB_OUTPUT"
            echo "inicio.json corresponde a ${fecha_archivo:-ninguna fecha}; se generará $fecha_hoy."
          fi

      - name: Preparar Node.js
        if: steps.vigencia.outputs.generar == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.vigencia.outputs.generar == 'true'
        run: npm ci

      - name: Generar datos diarios
        if: steps.vigencia.outputs.generar == 'true'
        shell: bash
        run: |
          for intento in 1 2 3; do
            if npm run generar-inicio && npm run generar-cancionero; then
              exit 0
            fi
            if [ "$intento" -eq 3 ]; then
              echo "La generación diaria falló después de 3 intentos."
              exit 1
            fi
            espera=$((intento * 20))
            echo "Intento $intento fallido; reintentando en ${espera}s."
            sleep "$espera"
          done
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar archivo actualizado
        if: steps.vigencia.outputs.generar == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/inicio.json datos/pasapalabra datos/cancionero
          if git diff --cached --quiet; then
            echo "El archivo diario ya estaba actualizado."
            exit 0
          fi
          git commit -m "chore: actualizar inicio diario"
          # Integrar cualquier publicación que haya llegado mientras se
          # generaban los datos antes de intentar escribir en main.
          git pull --rebase origin main
          git push
