name: Generar inicio diario

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/generar-inicio.js'
      - 'scripts/generar-cancionero.js'
  schedule:
    # Firestore reinicia la cuota diaria a medianoche del Pacífico.
    # Las 05:15 de Argentina dejan margen incluso durante el horario de verano de EE.UU.
    - cron: '15 5 * * *'
      timezone: 'America/Argentina/Buenos_Aires'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generar-inicio-diario
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar datos diarios
        shell: bash
        run: |
          for intento in 1 2 3; do
            if npm run generar-inicio && npm run generar-cancionero; then
              exit 0
            fi
            if [ "$intento" -eq 3 ]; then
              echo "La generación diaria falló después de 3 intentos."
              exit 1
            fi
            espera=$((intento * 20))
            echo "Intento $intento fallido; reintentando en ${espera}s."
            sleep "$espera"
          done
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar archivo actualizado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/inicio.json datos/pasapalabra datos/cancionero
          if git diff --cached --quiet; then
            echo "El archivo diario ya estaba actualizado."
            exit 0
          fi
          git commit -m "chore: actualizar inicio diario"
          # La sincronización offline puede publicar en paralelo. Integrar su
          # commit antes del push evita rechazos sin perder datos generados.
          git pull --rebase origin main
          git push
