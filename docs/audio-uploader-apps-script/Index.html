<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;place-items:center;padding:22px;color:#f7f4fb;background:#080c12}.card{width:min(520px,100%);padding:27px;border:1px solid #403052;border-radius:18px;background:#0f151d;box-shadow:0 25px 70px #0008}.kicker{color:#aa6dff;font-size:11px;font-weight:800;letter-spacing:.14em}h1{margin:7px 0 8px;font-size:26px}p{margin:0 0 21px;color:#aeb4bf;line-height:1.5}.file{display:grid;gap:8px;padding:17px;border:1px dashed #7650a8;border-radius:12px;background:#0b1118;font-size:13px;font-weight:700}input{width:100%;color:#d9d9e2}button,.result a{display:block;width:100%;margin-top:15px;padding:13px;border:1px solid #aa73ef;border-radius:10px;color:#fff;background:#713ab4;text-align:center;text-decoration:none;cursor:pointer;font:inherit;font-weight:800}button:disabled{opacity:.55;cursor:wait}.status{margin-top:14px;color:#c7cbd3;font-size:13px}.status.error{color:#ffabb7}.result{margin-top:18px;padding:16px;border:1px solid #416b4d;border-radius:12px;background:#102018}.result strong{display:block}.result small{display:block;margin-top:5px;color:#b6c8ba}.result button{background:#27633a;border-color:#559269}
  </style>
</head>
<body>
  <main class="card">
    <span class="kicker">CANCIONERO GEN</span>
    <h1>Subir un MP3</h1>
    <p>El archivo quedará guardado en el Drive institucional. Al terminar, copiá el enlace y pegalo en la propuesta del cancionero.</p>
    <form id="uploadForm">
      <label class="file">Archivo MP3, máximo 30 MB<input name="audioFile" type="file" accept="audio/mpeg,.mp3" required></label>
      <button id="submitButton" type="submit">Subir al Drive de Gen</button>
    </form>
    <div class="status" id="status" role="status"></div>
    <section class="result" id="result" hidden>
      <strong id="fileName"></strong><small>El enlace ya está listo para utilizar.</small>
      <a id="fileLink" target="_blank" rel="noopener">Abrir archivo</a>
      <button id="copyLink" type="button">Copiar enlace</button>
    </section>
  </main>
  <script>
    const form=document.getElementById('uploadForm'),button=document.getElementById('submitButton'),status=document.getElementById('status'),result=document.getElementById('result');
    form.addEventListener('submit',event=>{event.preventDefault();button.disabled=true;button.textContent='Subiendo…';status.className='status';status.textContent='No cierres esta ventana mientras se carga el archivo.';result.hidden=true;google.script.run.withSuccessHandler(data=>{button.disabled=false;button.textContent='Subir otro MP3';status.textContent='Carga terminada.';document.getElementById('fileName').textContent=data.name;document.getElementById('fileLink').href=data.url;document.getElementById('copyLink').dataset.url=data.url;result.hidden=false;form.reset();}).withFailureHandler(error=>{button.disabled=false;button.textContent='Intentar nuevamente';status.className='status error';status.textContent=error.message||'No se pudo subir el archivo.';}).uploadAudio(form);});
    document.getElementById('copyLink').addEventListener('click',async event=>{const url=event.currentTarget.dataset.url;try{await navigator.clipboard.writeText(url);event.currentTarget.textContent='Enlace copiado';}catch{window.prompt('Copiá este enlace:',url);}});
  </script>
</body>
</html>
